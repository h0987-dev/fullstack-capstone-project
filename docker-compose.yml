services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  giftlink:
    build: .
    ports: ["5000:5000"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: giftlink
      JWT_SECRET: change-me-in-production
    depends_on: [mongodb]
volumes:
  mongo-data:
